version: '3'
services:
  react-app:
    image: node:16-buster-slim
    container_name: react-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "
        ./jenkins/scripts/deliver.sh"
    environment:
      - NODE_ENV=production
    restart: always